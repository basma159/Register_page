<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="selection:bg-[#FF70BF] selection:text-white bg-cover bg-[linear-gradient(135deg,rgba(70,44,125,0.8),rgba(131,28,145,0.8),rgba(213,82,163,0.8),rgba(255,112,191,0.8)),url('/images/2.jpeg')]">

    <header
        class="w-full h-20 px-10 md:px-20 fixed z-10 backdrop-blur-md bg-[#831C91]/30 shadow-2xl shadow-black/50 flex flex-row justify-center md:justify-between md:items-center">

        <div class="container w-full flex flex-row justify-between items-center">
            <div class="shopping">
                <h1 class="text-white text-xl md:text-3xl font-extrabold">Shopping Cart</h1>
            </div> <!-- shopping -->

            <div class="menu-mobile relative md:hidden flex flex-col items-center justify-center gap-8 ">
                <i class="fa-solid fa-bars text-3xl text-white cursor-pointer"></i>

                <div class="menu w-48 py-10 hidden top-full -right-4 mt-8 absolute z-50
                 bg-[linear-gradient(135deg,rgba(70,44,125,0.8),rgba(131,28,145,0.8),rgba(213,82,163,0.8),rgba(255,112,191,0.8))]
                ring-1 ring-white/20 rounded-3xl backdrop-blur-md shadow-lg shadow-black/30">

                    <ul class="links flex flex-col items-center justify-center gap-10 py-4 ">
                        <li><a href="login.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign In</a></li>
                        <li><a href="register.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign Up</a></li>
                    </ul>
                    <ul class="userInfo flex flex-col items-center justify-center  py-4 " style="display: none;">
                        <li class="user font-bold text-white text-xl capitalize flex items-center justify-center gap-2">
                        </li>
                        <li
                            class="logout font-bold text-[#FF70BF] text-xl flex items-center justify-center gap-2  cursor-pointer hover:text-white">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>Log Out
                        </li>

                    </ul>
                </div>
                <script>
                    let mobileBtn = document.querySelector(".fa-bars")
                    let menu = document.querySelector(".menu")

                    mobileBtn.addEventListener("click", function () {
                        menu.classList.toggle("hidden")

                        if (menu.classList.contains("hidden")) {
                            mobileBtn.classList.add("fa-bars")
                            mobileBtn.classList.remove("fa-xmark")

                        }
                        else {
                            mobileBtn.classList.add("fa-xmark")
                            mobileBtn.classList.remove("fa-bars")
                        }
                    })
                </script>

            </div><!-- menu-mobile -->

            <div class="hidden md:block">
                <ul class="links flex md:flex-row items-center justify-center gap-8 flex-wrap">
                    <li><a href="login.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign In</a></li>
                    <li><a href="register.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign Up</a></li>
                </ul>
                <ul class="userInfo" style="display: none;">
                    <li class="user font-bold text-white text-xl capitalize flex items-center justify-center gap-2">
                    </li>
                    <li
                        class="logout font-bold text-[#FF70BF] text-xl flex items-center justify-center gap-2  cursor-pointer hover:text-white">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>LogOut
                    </li>

                </ul>
            </div>
        </div> <!-- container -->

    </header>

    <section class="home w-full min-h-screen flex justify-center items-center">

        <form
            class="w-96 h-96 rounded-3xl bg-[#831C91]/30 backdrop-blur-sm shadow-2xl shadow-black flex flex-col justify-center items-center gap-6 ring-1 ring-white/20">

            <h2 class="home_page font-bold text-white text-3xl flex flex-col justify-center items-center gap-2">
                <i class="fa-solid fa-house-user "></i>Welcome to Home Page
            </h2>

        </form>
    </section>



    <script src="js/script.js"></script>
</body>

</html>
