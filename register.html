<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resigster Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body
    class="h-[1000px] selection:bg-[#FF70BF] selection:text-white 
     bg-cover bg-[linear-gradient(135deg,rgba(70,44,125,0.8),rgba(131,28,145,0.8),rgba(213,82,163,0.8),rgba(255,112,191,0.8)),url('/images/2.jpeg')]">
    <header
        class="w-full h-20 px-10 md:px-20 fixed z-10 backdrop-blur-md bg-[#831C91]/30 shadow-2xl shadow-black/50 flex flex-row justify-center md:justify-between md:items-center">

        <div class="container w-full flex flex-row justify-between items-center">
            <div class="shopping">
                <h1 class="text-white text-xl md:text-3xl font-extrabold">Shopping Cart</h1>
            </div> <!-- shopping -->

            <div class="menu-mobile relative md:hidden flex flex-col items-center justify-center gap-8 ">
                <i class="fa-solid fa-bars text-3xl text-white cursor-pointer"></i>

                <div class="menu w-48 py-10 hidden top-full -right-4 mt-8 absolute z-50
                 bg-[linear-gradient(135deg,rgba(70,44,125,0.8),rgba(131,28,145,0.8),rgba(213,82,163,0.8),rgba(255,112,191,0.8))]
                ring-1 ring-white/20 rounded-3xl backdrop-blur-md shadow-lg shadow-black/30">

                    <ul class="links flex flex-col items-center justify-center gap-10 py-4 ">
                        <li><a href="login.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign In</a></li>
                        <li><a href="register.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign Up</a></li>
                    </ul>
                    <ul class="userInfo  flex flex-col items-center justify-center gap-10 py-4 " style="display: none;">
                        <li class="user"></li>
                        <li class="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i>LogOut</li>

                    </ul>
                </div>
                <script>
                    let mobileBtn = document.querySelector(".fa-bars")
                    let menu = document.querySelector(".menu")

                    mobileBtn.addEventListener("click", function () {
                        menu.classList.toggle("hidden")

                        if (menu.classList.contains("hidden")) {
                            mobileBtn.classList.add("fa-bars")
                            mobileBtn.classList.remove("fa-xmark")

                        }
                        else {
                            mobileBtn.classList.add("fa-xmark")
                            mobileBtn.classList.remove("fa-bars")
                        }
                    })
                </script>

            </div><!-- menu-mobile -->

            <div class="hidden md:block">
                <ul class="links flex md:flex-row items-center justify-center gap-8 flex-wrap">
                    <li><a href="login.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign In</a></li>
                    <li><a href="register.html" class="text-white text-xl font-extrabold rounded-3xl p-3 ring-1
                         ring-[#FF70BF] hover:bg-[#FF70BF] hover:shadow-xl hover:shadow-black/30">Sign Up</a></li>
                </ul>
                <ul class="userInfo" style="display: none;">
                    <li class="user"></li>
                    <li class="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i>LogOut</li>

                </ul>
            </div>
        </div> <!-- container -->

    </header>

    <section id="register_form" class="home w-full min-h-screen flex justify-center items-center ">

        <form
            class="w-[95%] sm:w-[80%] md:w-[400px] h-fit rounded-3xl py-6 bg-[#831C91]/30 backdrop-blur-sm shadow-2xl shadow-black flex flex-col justify-center items-center gap-6 ring-1 ring-white/20">
            <i class="fa-solid fa-user text-6xl text-white"></i>

            <h2 class="text-3xl text-white tracking-widest font-bold">Register Form</h2>
            <input type="text" placeholder="Enter Your Name" id="userName"
                class="w-72 h-9 outline-none rounded-xl p-2 text-lg text-[#831C91]">
            <input type="email" placeholder="Enter Your Email" id="email"
                class="w-72 h-9 outline-none rounded-xl p-2 text-lg text-[#831C91]">
            <input type="password" placeholder="Enter Your Password" id="password"
                class="w-72 h-9 outline-none rounded-xl p-2 text-lg text-[#831C91]">
            <input type="submit" value="Sign Up" id="signUp"
                class="text-xl font-extrabold  text-white bg-[#FF70BF] rounded-3xl px-4 py-3 hover:bg-[#D552A3] hover:shadow-lg hover:shadow-black/20 cursor-pointer">

        </form>

    </section>
    <script src="js/register.js"></script>

</body>

</html>
